@if (docs.sidebarOpen()) {
  <div
    (click)="docs.closeSidebar()"
    class="fixed inset-0 bg-black/60 backdrop-blur-sm z-30 lg:hidden"
  ></div>
}

<nav
  [class]="'fixed lg:sticky top-0 left-0 z-40 h-screen w-[78vw] sm:w-72 lg:w-full ' +
    'flex flex-col bg-panel/95 backdrop-blur-md ' +
    'border-r border-border overflow-y-auto transition-transform duration-300 ease-out ' +
    (docs.sidebarOpen() ? 'translate-x-0' : '-translate-x-full lg:translate-x-0')">

  <div class="flex items-center justify-between gap-2 px-4 sm:px-5 py-5 border-b border-border/70">
    <div class="flex items-center gap-2.5 min-w-0">
      <div class="flex items-center justify-center w-8 h-8 rounded-lg bg-red/10 border border-red/20 text-red shrink-0">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
        </svg>
      </div>
      <div class="min-w-0">
        <p class="font-display font-semibold text-sm text-text tracking-tight truncate">Docs Hub</p>
        <p class="text-[11px] text-dim truncate">Referencia rápida</p>
      </div>
    </div>
    <button
      (click)="docs.closeSidebar()"
      aria-label="Cerrar menú"
      class="lg:hidden text-dim hover:text-text p-1.5 rounded-md hover:bg-white/5 transition-colors shrink-0">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <div class="flex-1 py-4 sm:py-5 px-3">
    <p class="text-[11px] uppercase tracking-widest text-dim font-semibold px-2.5 mb-2">
      Tecnologías
    </p>

    <div class="flex flex-col gap-0.5">
      @for (tech of docs.technologies(); track tech.id) {
        <button
          (click)="select(tech.id)"
          [class]="'group relative flex items-center gap-2.5 pl-3 pr-2.5 py-2.5 rounded-md text-sm text-left transition-colors duration-150 ' +
            (docs.activeTechId() === tech.id
              ? 'text-text bg-white/[0.04]'
              : 'text-dim hover:text-text hover:bg-white/[0.03]')">
          <span
            [class]="'absolute left-0 top-1.5 bottom-1.5 w-[2.5px] rounded-full transition-opacity duration-150 ' +
              (docs.activeTechId() === tech.id ? 'opacity-100' : 'opacity-0')"
            [style.background]="tech.color">
          </span>
          <span
            class="w-2 h-2 rounded-full shrink-0 ring-2 ring-transparent transition-shadow"
            [class.ring-white/10]="docs.activeTechId() === tech.id"
            [style.background]="tech.color">
          </span>
          <span class="truncate">{{ tech.name }}</span>
        </button>
      }
    </div>

    @if (docs.technologies().length === 0 && !docs.loading()) {
      <p class="text-dim text-xs px-2.5 mt-2">Sin tecnologías cargadas.</p>
    }
  </div>

  <div class="px-5 py-4 border-t border-border/70">
    <p class="text-[11px] text-dim/70 font-mono">fredy@dev · docs-hub</p>
  </div>
</nav>
